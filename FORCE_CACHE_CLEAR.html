<!DOCTYPE html>
<html>
<head>
    <title>WIMP - Force Cache Clear</title>
    <script>
        console.log('🔥 FORCE CACHE CLEAR: Starting aggressive cache clearing...');
        
        // Clear all browser storage
        localStorage.clear();
        sessionStorage.clear();
        
        if ('caches' in window) {
            caches.keys().then(function(names) {
                names.forEach(function(name) {
                    caches.delete(name);
                    console.log('🗑️ Deleted cache:', name);
                });
            });
        }
        
        // Unregister service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                registrations.forEach(function(registration) {
                    registration.unregister();
                    console.log('🔧 Unregistered service worker');
                });
            });
        }
        
        console.log('✅ CACHE CLEAR COMPLETE');
        console.log('🔄 Redirecting to fresh app...');
        
        // Redirect with cache-busting timestamp
        setTimeout(function() {
            window.location.href = '/app?nocache=' + Date.now();
        }, 2000);
    </script>
</head>
<body>
    <h1>🔥 Clearing All Caches...</h1>
    <p>Please wait while we clear all cached files...</p>
    <p><strong>You will be redirected automatically in 2 seconds.</strong></p>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🔥 DOM LOADED: Cache clearing initiated');
        });
    </script>
</body>
</html>
