<!DOCTYPE html>
<html>
<head>
    <title>Quick Auth Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        button { padding: 10px 20px; margin: 10px; background: #1976d2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .status { background: #f5f5f5; padding: 15px; margin: 15px 0; border-left: 4px solid #2196f3; }
        .log { padding: 5px; margin: 5px 0; font-family: monospace; font-size: 12px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Quick Authentication Test</h1>
    
    <div class="status" id="status">Checking token...</div>
    
    <button onclick="clearAndLogin()">Clear All + Fresh Login</button>
    <button onclick="testAPIs()">Test All APIs</button>
    
    <div id="logs"></div>
    
    <script>
    function log(msg, type = 'log') {
        const div = document.createElement('div');
        div.className = `log ${type}`;
        div.textContent = new Date().toLocaleTimeString() + ': ' + msg;
        document.getElementById('logs').appendChild(div);
    }
    
    function updateStatus() {
        const token = localStorage.getItem('authToken');
        const statusEl = document.getElementById('status');
        
        if (!token) {
            statusEl.innerHTML = '<strong>Status:</strong> No token found';
            return;
        }
        
        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            const now = Math.floor(Date.now() / 1000);
            const isExpired = now > payload.exp;
            
            statusEl.innerHTML = `<strong>Status:</strong> ${isExpired ? 'EXPIRED' : 'VALID'} token<br>
                <small>Expires: ${new Date(payload.exp * 1000).toLocaleString()}</small>`;
        } catch (e) {
            statusEl.innerHTML = '<strong>Status:</strong> Invalid token format';
        }
    }
    
    async function clearAndLogin() {
        log('Clearing all storage and getting fresh token...');
        
        localStorage.clear();
        sessionStorage.clear();
        
        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: 'test@newwimp.app', password: 'password123' })
            });
            
            const data = await response.json();
            
            if (data.success && data.token) {
                localStorage.setItem('authToken', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                localStorage.setItem('isAuthenticated', 'true');
                
                log('Fresh login successful!', 'success');
                updateStatus();
            } else {
                log('Login failed', 'error');
            }
        } catch (error) {
            log('Login error: ' + error.message, 'error');
        }
    }
    
    async function testAPIs() {
        const token = localStorage.getItem('authToken');
        if (!token) {
            log('No token found - run login first', 'error');
            return;
        }
        
        const apis = [
            '/api/auth/me',
            '/api/financial/overview', 
            '/api/subscription/status',
            '/api/ingredients',
            '/api/shopping'
        ];
        
        for (const api of apis) {
            try {
                const response = await fetch(api, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const result = response.ok ? 'SUCCESS' : `FAILED (${response.status})`;
                log(`${api}: ${result}`, response.ok ? 'success' : 'error');
                
            } catch (error) {
                log(`${api}: ERROR - ${error.message}`, 'error');
            }
        }
    }
    
    // Initial status check
    updateStatus();
    </script>
</body>
</html>
