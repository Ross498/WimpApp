<!DOCTYPE html>
<html>
<head>
    <title>React Minimal Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f0f0f0; }
        #root { border: 2px solid blue; padding: 20px; margin: 20px 0; background: white; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
    </style>
</head>
<body>
    <h1>React Minimal Mounting Test</h1>
    <div class="status">Testing if React can mount the most basic component...</div>
    
    <div id="root">
        <p style="color: red;">This content should be replaced by React</p>
    </div>
    
    <div id="log"></div>

    <script>
        console.log('🔍 MINIMAL: Starting minimal React test');
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const className = type === 'error' ? 'error' : 'success';
            logDiv.innerHTML += `<div class="status ${className}">${message}</div>`;
            console.log(`🔍 MINIMAL: ${message}`);
        }
        
        log('Step 1: Page loaded, checking for React bundle');
        
        // Test if we can load and execute the bundle
        const script = document.createElement('script');
        script.type = 'module';
        script.src = '/assets/index.js';
        
        script.onload = function() {
            log('Step 2: Bundle loaded successfully', 'success');
            
            setTimeout(() => {
                const root = document.getElementById('root');
                if (root && root.innerHTML.includes('React')) {
                    log('Step 3: React content detected!', 'success');
                } else if (root && root.innerHTML !== '<p style="color: red;">This content should be replaced by React</p>') {
                    log('Step 3: Root div changed but no React detected', 'error');
                } else {
                    log('Step 3: Root div unchanged - React not mounting', 'error');
                }
            }, 2000);
        };
        
        script.onerror = function(error) {
            log('Step 2: Bundle loading failed - ' + error, 'error');
        };
        
        document.head.appendChild(script);
        
        // Also test direct fetch of the bundle
        fetch('/assets/index.js')
            .then(response => {
                log(`Bundle fetch: HTTP ${response.status} (${response.ok ? 'OK' : 'FAIL'})`);
                return response.text();
            })
            .then(content => {
                log(`Bundle size: ${content.length} characters`);
                if (content.includes('ReactDOM') || content.includes('createRoot')) {
                    log('Bundle contains React DOM code', 'success');
                } else {
                    log('Bundle missing React DOM code', 'error');
                }
            })
            .catch(error => {
                log('Bundle fetch failed: ' + error.message, 'error');
            });
    </script>
</body>
</html>
