<!DOCTYPE html>
<html>
<head>
    <title>Token Debug Tool</title>
    <script>
    // Prevent React app from loading by clearing the root element immediately
    document.addEventListener('DOMContentLoaded', function() {
        const root = document.getElementById('root');
        if (root) {
            root.innerHTML = '';
            root.style.display = 'none';
        }
    });
    </script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 800px; 
            margin: 20px auto; 
            padding: 20px; 
        }
        .debug { 
            background: #f5f5f5; 
            padding: 15px; 
            margin: 10px 0; 
            border-radius: 8px; 
            font-family: monospace;
        }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
        .warning { background: #fff3e0; color: #ef6c00; }
        button {
            padding: 12px 24px;
            margin: 10px 5px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>🔍 Authentication Token Debug Tool</h1>
    
    <button onclick="debugTokens()">Debug Token Issues</button>
    <button onclick="testFinancialEndpoint()">Test Financial Endpoint</button>
    <button onclick="clearAll()">Clear All Storage</button>
    
    <div id="results"></div>
    
    <script>
    function log(message, type = 'debug') {
        const div = document.createElement('div');
        div.className = `debug ${type}`;
        div.innerHTML = `${new Date().toLocaleTimeString()}: ${message}`;
        document.getElementById('results').appendChild(div);
    }
    
    function debugTokens() {
        document.getElementById('results').innerHTML = '';
        
        log('=== TOKEN STORAGE DEBUGGING ===');
        
        // Check all possible storage locations
        const authToken = localStorage.getItem('authToken');
        const token = localStorage.getItem('token');
        const authToken2 = localStorage.getItem('auth_token');
        const sessionAuthToken = sessionStorage.getItem('authToken');
        const sessionToken = sessionStorage.getItem('token');
        
        log(`localStorage.authToken: ${authToken ? authToken.substring(0, 30) + '...' : 'NOT FOUND'}`, authToken ? 'success' : 'error');
        log(`localStorage.token: ${token ? token.substring(0, 30) + '...' : 'NOT FOUND'}`, token ? 'success' : 'error');
        log(`localStorage.auth_token: ${authToken2 ? authToken2.substring(0, 30) + '...' : 'NOT FOUND'}`, authToken2 ? 'success' : 'error');
        log(`sessionStorage.authToken: ${sessionAuthToken ? sessionAuthToken.substring(0, 30) + '...' : 'NOT FOUND'}`, sessionAuthToken ? 'success' : 'error');
        log(`sessionStorage.token: ${sessionToken ? sessionToken.substring(0, 30) + '...' : 'NOT FOUND'}`, sessionToken ? 'success' : 'error');
        
        // Check user data
        const userData = localStorage.getItem('user');
        const isAuthenticated = localStorage.getItem('isAuthenticated');
        
        log(`User data exists: ${!!userData}`, userData ? 'success' : 'error');
        log(`isAuthenticated flag: ${isAuthenticated}`, isAuthenticated === 'true' ? 'success' : 'error');
        
        if (userData) {
            try {
                const user = JSON.parse(userData);
                log(`User: ${user.email} (ID: ${user.id})`, 'success');
            } catch (e) {
                log(`User data corrupted: ${e.message}`, 'error');
            }
        }
        
        // Test token validity
        const primaryToken = authToken || token || authToken2;
        if (primaryToken) {
            try {
                // Decode JWT payload
                const payload = JSON.parse(atob(primaryToken.split('.')[1]));
                const now = Math.floor(Date.now() / 1000);
                const isExpired = now > payload.exp;
                
                log(`Token expiry: ${new Date(payload.exp * 1000).toLocaleString()}`, isExpired ? 'error' : 'success');
                log(`Token valid: ${!isExpired}`, isExpired ? 'error' : 'success');
                log(`Time until expiry: ${Math.floor((payload.exp - now) / 3600)} hours`, isExpired ? 'error' : 'success');
            } catch (e) {
                log(`Token decode failed: ${e.message}`, 'error');
            }
        }
    }
    
    async function testFinancialEndpoint() {
        log('=== TESTING FINANCIAL ENDPOINT ===');
        
        // Get token using same logic as apiService
        const token = localStorage.getItem('authToken');
        log(`Retrieved token: ${token ? 'YES (' + token.length + ' chars)' : 'NO'}`, token ? 'success' : 'error');
        
        if (!token) {
            log('No token available - attempting fresh login...', 'warning');
            
            try {
                const loginResponse = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: 'test@newwimp.app', 
                        password: 'password123' 
                    })
                });
                
                if (loginResponse.ok) {
                    const loginData = await loginResponse.json();
                    if (loginData.token) {
                        localStorage.setItem('authToken', loginData.token);
                        localStorage.setItem('user', JSON.stringify(loginData.user));
                        log('Fresh login successful - token obtained', 'success');
                        return testFinancialEndpoint(); // Retry with new token
                    }
                } else {
                    log(`Login failed: ${loginResponse.status}`, 'error');
                    return;
                }
            } catch (error) {
                log(`Login error: ${error.message}`, 'error');
                return;
            }
        }
        
        // Test financial endpoint
        const headers = {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
        };
        
        log(`Making request with headers: ${Object.keys(headers).join(', ')}`, 'debug');
        log(`Authorization header: Bearer ${token.substring(0, 20)}...`, 'debug');
        
        try {
            const response = await fetch('/api/financial/overview', {
                method: 'GET',
                headers: headers,
                credentials: 'include'
            });
            
            log(`Financial endpoint response: ${response.status}`, response.ok ? 'success' : 'error');
            
            if (response.ok) {
                const data = await response.json();
                log(`Financial data received: ${JSON.stringify(data).substring(0, 200)}...`, 'success');
            } else {
                const errorText = await response.text();
                log(`Error response: ${errorText}`, 'error');
            }
            
        } catch (error) {
            log(`Request failed: ${error.message}`, 'error');
        }
    }
    
    function clearAll() {
        localStorage.clear();
        sessionStorage.clear();
        log('All storage cleared', 'warning');
    }
    
    // Auto-run debug on load
    setTimeout(debugTokens, 500);
    </script>
</body>
</html>
