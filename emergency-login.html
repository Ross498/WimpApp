<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Login - WIMP Kitchen Companion</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }
        .logo p {
            color: #666;
            font-size: 16px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        input[type="email"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }
        .test-credentials {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .test-credentials strong {
            color: #495057;
        }
        .fill-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 8px;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .debug-info {
            background: #e2e3e5;
            padding: 10px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 12px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>🍳 WIMP</h1>
            <p>Emergency Login Portal</p>
        </div>

        <div class="test-credentials">
            <strong>Test Credentials:</strong><br>
            Email: test@newwimp.app<br>
            Password: password123
            <button class="fill-btn" onclick="fillTestCredentials()">Auto-Fill</button>
        </div>

        <div id="message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn" id="loginBtn">
                Sign In to WIMP
            </button>
        </form>

        <div class="debug-info" id="debugInfo">
            Ready to test authentication...
        </div>
    </div>

    <script>
        console.log('🚨 EMERGENCY LOGIN PAGE LOADED');
        
        function showMessage(text, type = 'error') {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="${type}">${text}</div>`;
        }
        
        function updateDebug(text) {
            document.getElementById('debugInfo').textContent = text;
        }
        
        function fillTestCredentials() {
            document.getElementById('email').value = 'test@newwimp.app';
            document.getElementById('password').value = 'password123';
            showMessage('Test credentials filled! Click "Sign In to WIMP"', 'success');
        }
        
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            
            console.log('🚨 EMERGENCY LOGIN ATTEMPT:', { email, passwordLength: password.length });
            
            if (!email || !password) {
                showMessage('Please enter both email and password');
                return;
            }
            
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing In...';
            updateDebug('Making authentication request...');
            
            const credentials = { email, password };
            console.log('🚨 REQUEST BODY:', credentials);
            console.log('🚨 JSON STRINGIFIED:', JSON.stringify(credentials));
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(credentials),
                    credentials: 'include',
                });
                
                console.log('🚨 RESPONSE STATUS:', response.status);
                updateDebug(`Response status: ${response.status}`);
                
                const responseText = await response.text();
                console.log('🚨 RAW RESPONSE:', responseText);
                
                let data;
                try {
                    data = JSON.parse(responseText);
                    console.log('🚨 PARSED DATA:', data);
                } catch (parseError) {
                    console.error('🚨 JSON PARSE ERROR:', parseError);
                    showMessage(`Failed to parse response: ${responseText}`);
                    return;
                }
                
                if (response.ok && data.success && data.token && data.user) {
                    console.log('✅ EMERGENCY LOGIN SUCCESS!');
                    
                    // Store authentication data
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('isAuthenticated', 'true');
                    
                    showMessage(`Login successful! Welcome ${data.user.name || data.user.email}`, 'success');
                    updateDebug(`Authenticated as: ${data.user.email}`);
                    
                    // Redirect to main app
                    setTimeout(() => {
                        window.location.href = '/app';
                    }, 2000);
                    
                } else {
                    console.log('❌ EMERGENCY LOGIN FAILED:', data);
                    showMessage(data.error || data.message || 'Login failed');
                    updateDebug(`Error: ${data.error || 'Unknown error'}`);
                }
                
            } catch (error) {
                console.error('❌ EMERGENCY LOGIN ERROR:', error);
                showMessage(`Request failed: ${error.message}`);
                updateDebug(`Network error: ${error.message}`);
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In to WIMP';
            }
        });
        
        // Auto-fill test credentials on page load
        window.addEventListener('load', () => {
            fillTestCredentials();
        });
    </script>
</body>
</html>
