<!DOCTYPE html>
<html>
<head>
    <title>Deep Token Debug</title>
    <style>
        body { font-family: monospace; max-width: 1200px; margin: 10px auto; padding: 10px; font-size: 12px; }
        .log { padding: 5px; margin: 2px 0; border-radius: 3px; }
        .error { background: #ffe6e6; }
        .success { background: #e6ffe6; }
        .warning { background: #fff0e6; }
        .info { background: #e6f3ff; }
        button { padding: 8px 15px; margin: 5px; }
        .token-box { background: #f5f5f5; padding: 10px; margin: 10px 0; word-break: break-all; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h2>Deep Frontend Token Debug</h2>
    <button onclick="runDeepTest()">Run Deep Token Investigation</button>
    <button onclick="clearAll()">Clear All Storage</button>
    
    <div id="logs"></div>
    
    <script>
    function log(message, type = 'info') {
        const div = document.createElement('div');
        div.className = `log ${type}`;
        div.innerHTML = `${new Date().toISOString()}: ${message}`;
        document.getElementById('logs').appendChild(div);
        console.log(message);
    }
    
    function clearAll() {
        localStorage.clear();
        sessionStorage.clear();
        document.getElementById('logs').innerHTML = '';
        log('Storage cleared', 'info');
    }
    
    async function runDeepTest() {
        document.getElementById('logs').innerHTML = '';
        
        log('=== DEEP TOKEN INVESTIGATION ===', 'info');
        
        // Check what tokens currently exist
        const existingToken = localStorage.getItem('authToken');
        log(`Existing token in storage: ${existingToken ? existingToken.substring(0, 100) + '...' : 'NONE'}`, existingToken ? 'warning' : 'info');
        
        if (existingToken) {
            // Try to decode the existing token to see if it's expired
            try {
                const parts = existingToken.split('.');
                const payload = JSON.parse(atob(parts[1]));
                const now = Math.floor(Date.now() / 1000);
                const exp = payload.exp;
                log(`Token expires: ${new Date(exp * 1000).toISOString()}`, 'info');
                log(`Current time: ${new Date(now * 1000).toISOString()}`, 'info');
                log(`Token expired: ${now > exp ? 'YES' : 'NO'}`, now > exp ? 'error' : 'success');
                
                if (now > exp) {
                    log('FOUND THE PROBLEM: Browser has expired token!', 'error');
                }
            } catch (e) {
                log(`Could not decode token: ${e.message}`, 'error');
            }
        }
        
        // Step 1: Fresh login
        log('Step 1: Getting fresh token...', 'info');
        try {
            const loginResp = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: 'test@newwimp.app', password: 'password123' })
            });
            
            const loginData = await loginResp.json();
            
            if (loginData.success && loginData.token) {
                log('Fresh login successful', 'success');
                
                // Decode new token
                const parts = loginData.token.split('.');
                const payload = JSON.parse(atob(parts[1]));
                const now = Math.floor(Date.now() / 1000);
                log(`New token expires: ${new Date(payload.exp * 1000).toISOString()}`, 'info');
                log(`New token valid for: ${Math.floor((payload.exp - now) / 3600)} hours`, 'success');
                
                // Store new token
                localStorage.setItem('authToken', loginData.token);
                log('New token stored in localStorage', 'success');
                
                const tokenBox = document.createElement('div');
                tokenBox.className = 'token-box';
                tokenBox.innerHTML = `<strong>Fresh Token:</strong><br>${loginData.token}`;
                document.getElementById('logs').appendChild(tokenBox);
                
            } else {
                log('Login failed', 'error');
                return;
            }
        } catch (error) {
            log(`Login error: ${error.message}`, 'error');
            return;
        }
        
        // Step 2: Test API calls and monitor token
        log('Step 2: Testing API calls with fresh token...', 'info');
        const freshToken = localStorage.getItem('authToken');
        
        const testAPIs = [
            '/api/auth/me',
            '/api/financial/overview', 
            '/api/subscription/status',
            '/api/ingredients'
        ];
        
        for (const api of testAPIs) {
            const tokenBefore = localStorage.getItem('authToken');
            log(`Testing ${api}...`, 'info');
            log(`Token before call: ${tokenBefore ? 'EXISTS' : 'MISSING'}`, tokenBefore ? 'info' : 'error');
            
            try {
                const resp = await fetch(api, {
                    headers: { 'Authorization': `Bearer ${tokenBefore}` }
                });
                
                const tokenAfter = localStorage.getItem('authToken');
                
                log(`${api} response: ${resp.status} ${resp.statusText}`, resp.ok ? 'success' : 'error');
                log(`Token after call: ${tokenAfter ? 'EXISTS' : 'MISSING'}`, tokenAfter ? 'info' : 'error');
                
                if (tokenBefore && !tokenAfter) {
                    log(`🚨 TOKEN WAS CLEARED BY ${api}!`, 'error');
                    break;
                } else if (tokenBefore && tokenAfter && tokenBefore !== tokenAfter) {
                    log(`🚨 TOKEN WAS CHANGED BY ${api}!`, 'error');
                    break;
                }
                
                const data = await resp.json();
                log(`Response data: ${JSON.stringify(data).substring(0, 200)}...`, 'info');
                
            } catch (error) {
                const tokenAfterError = localStorage.getItem('authToken');
                log(`${api} error: ${error.message}`, 'error');
                log(`Token after error: ${tokenAfterError ? 'EXISTS' : 'MISSING'}`, tokenAfterError ? 'info' : 'error');
                
                if (tokenBefore && !tokenAfterError) {
                    log(`🚨 TOKEN CLEARED BY ERROR in ${api}!`, 'error');
                    break;
                }
            }
        }
        
        const finalToken = localStorage.getItem('authToken');
        log('=== FINAL RESULT ===', 'info');
        log(`Original fresh token: ${freshToken ? 'HAD' : 'NONE'}`, 'info');
        log(`Final token: ${finalToken ? 'HAS' : 'NONE'}`, 'info');
        log(`Token preserved: ${freshToken && finalToken && freshToken === finalToken ? 'YES' : 'NO'}`, 
            freshToken && finalToken && freshToken === finalToken ? 'success' : 'error');
    }
    </script>
</body>
</html>
