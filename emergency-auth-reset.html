<!DOCTYPE html>
<html>
<head>
    <title>Emergency Authentication Reset - WIMP</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background: #1E293B; 
            color: white; 
            text-align: center; 
            padding: 20px; 
        }
        .container { max-width: 600px; margin: 0 auto; }
        button { 
            background: #F59E0B; 
            color: white; 
            border: none; 
            padding: 16px 32px; 
            border-radius: 8px; 
            font-size: 18px; 
            cursor: pointer; 
            margin: 16px; 
        }
        button:hover { background: #D97706; }
        .status { margin: 20px 0; padding: 16px; border-radius: 8px; }
        .success { background: rgba(34, 197, 94, 0.2); border: 1px solid #22C55E; }
        .error { background: rgba(239, 68, 68, 0.2); border: 1px solid #EF4444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 Emergency Authentication Reset</h1>
        <p>This will completely clear all cached authentication data and force fresh login.</p>
        
        <button onclick="emergencyReset()">EMERGENCY RESET</button>
        <button onclick="testAuth()">Test Backend Auth</button>
        
        <div id="status"></div>
        <div id="logs" style="text-align: left; font-family: monospace; font-size: 12px; margin-top: 20px;"></div>
    </div>

    <script>
        function log(message) {
            const logs = document.getElementById('logs');
            logs.innerHTML += new Date().toLocaleTimeString() + ': ' + message + '<br>';
            console.log(message);
        }

        function showStatus(message, type = 'success') {
            document.getElementById('status').innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        async function emergencyReset() {
            log('🚨 Starting emergency authentication reset...');
            
            try {
                // 1. Clear ALL browser storage
                localStorage.clear();
                sessionStorage.clear();
                log('✅ Cleared localStorage and sessionStorage');
                
                // 2. Clear cookies
                document.cookie.split(";").forEach(function(c) { 
                    document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
                });
                log('✅ Cleared all cookies');
                
                // 3. Clear IndexedDB
                if ('indexedDB' in window) {
                    const databases = await indexedDB.databases();
                    for (const db of databases) {
                        if (db.name) {
                            indexedDB.deleteDatabase(db.name);
                            log(`✅ Cleared IndexedDB: ${db.name}`);
                        }
                    }
                }
                
                // 4. Clear service worker caches
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (const registration of registrations) {
                        await registration.unregister();
                        log('✅ Unregistered service worker');
                    }
                }
                
                // 5. Clear Cache API
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    for (const cacheName of cacheNames) {
                        await caches.delete(cacheName);
                        log(`✅ Cleared cache: ${cacheName}`);
                    }
                }
                
                // 6. Test that backend auth is working
                const testResponse = await fetch('/api/auth/me', {
                    headers: { 'Authorization': 'Bearer invalid-token' }
                });
                log(`🔍 Backend auth test: ${testResponse.status} (should be 401)`);
                
                showStatus('✅ Emergency reset complete! Redirecting in 3 seconds...', 'success');
                
                setTimeout(() => {
                    window.location.href = '/app';
                }, 3000);
                
            } catch (error) {
                log(`❌ Error during reset: ${error.message}`);
                showStatus('❌ Reset failed. Try manual browser reset.', 'error');
            }
        }

        async function testAuth() {
            log('🔍 Testing backend authentication...');
            
            try {
                // Test login endpoint
                const loginTest = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'authfinal@wimp.app',
                        password: 'AuthFinal123!'
                    })
                });
                
                const loginData = await loginTest.json();
                log(`✅ Login test: ${loginTest.status} - ${loginData.success ? 'SUCCESS' : 'FAILED'}`);
                
                if (loginData.success) {
                    // Test auth/me endpoint
                    const meTest = await fetch('/api/auth/me', {
                        headers: { 'Authorization': `Bearer ${loginData.token}` }
                    });
                    const meData = await meTest.json();
                    log(`✅ Auth/me test: ${meTest.status} - User: ${meData.user?.name || 'NONE'}`);
                }
                
                showStatus('✅ Backend authentication is working properly', 'success');
                
            } catch (error) {
                log(`❌ Auth test failed: ${error.message}`);
                showStatus('❌ Backend authentication has issues', 'error');
            }
        }
    </script>
</body>
</html>
