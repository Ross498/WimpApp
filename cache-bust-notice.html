<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIMP - Cache Update Notice</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }
        h1 { margin-bottom: 20px; font-size: 24px; }
        .icon { font-size: 48px; margin-bottom: 20px; }
        .message { margin: 20px 0; line-height: 1.6; opacity: 0.9; }
        .button {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s;
        }
        .button:hover { transform: scale(1.05); }
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hidden { display: none; }
        .progress {
            background: rgba(255,255,255,0.2);
            height: 4px;
            border-radius: 2px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-bar {
            background: white;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔄</div>
        <h1>App Update Available</h1>
        
        <div id="initial-message" class="message">
            We've fixed loading issues and improved performance. 
            Clear your cache to get the latest version.
        </div>
        
        <div id="progress-section" class="hidden">
            <div class="message">Clearing caches and updating...</div>
            <div class="progress">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div id="status-text" class="message">Preparing...</div>
        </div>
        
        <div id="complete-section" class="hidden">
            <div class="icon">✅</div>
            <div class="message">Update complete! Redirecting to app...</div>
        </div>
        
        <div id="buttons">
            <button class="button" onclick="updateNow()">Update Now</button>
            <button class="button" onclick="skipUpdate()" style="background: rgba(255,255,255,0.2); color: white;">Skip</button>
        </div>
        
        <div id="spinner" class="spinner hidden"></div>
    </div>

    <script>
        let progressStep = 0;
        const steps = [
            'Clearing browser cache...',
            'Removing service worker...',
            'Clearing local storage...',
            'Testing fresh assets...',
            'Finalizing update...'
        ];

        function updateProgress() {
            const progressBar = document.getElementById('progress-bar');
            const statusText = document.getElementById('status-text');
            
            if (progressStep < steps.length) {
                const percent = (progressStep / steps.length) * 100;
                progressBar.style.width = percent + '%';
                statusText.textContent = steps[progressStep];
                progressStep++;
                
                setTimeout(updateProgress, 800 + Math.random() * 400);
            } else {
                // Complete
                document.getElementById('progress-section').classList.add('hidden');
                document.getElementById('complete-section').classList.remove('hidden');
                
                setTimeout(() => {
                    window.location.href = `/app?v=${Date.now()}&updated=true`;
                }, 2000);
            }
        }

        async function updateNow() {
            document.getElementById('initial-message').classList.add('hidden');
            document.getElementById('buttons').classList.add('hidden');
            document.getElementById('progress-section').classList.remove('hidden');
            
            // Start progress animation
            updateProgress();
            
            // Actually clear caches in parallel
            try {
                await Promise.all([
                    clearAllCaches(),
                    clearStorages(),
                    unregisterServiceWorkers()
                ]);
            } catch (error) {
                console.log('Cache clearing completed with some non-critical errors:', error);
            }
        }

        async function clearAllCaches() {
            if ('caches' in window) {
                const cacheNames = await caches.keys();
                await Promise.all(cacheNames.map(name => caches.delete(name)));
            }
        }

        function clearStorages() {
            try {
                localStorage.clear();
                sessionStorage.clear();
            } catch (e) {
                // Storage might not be available in some contexts
            }
        }

        async function unregisterServiceWorkers() {
            if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                await Promise.all(registrations.map(reg => reg.unregister()));
            }
        }

        function skipUpdate() {
            window.location.href = '/app';
        }

        // Auto-trigger for users coming from specific routes
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('auto') === 'true') {
                setTimeout(updateNow, 1000);
            }
        });
    </script>
</body>
</html>
