<!DOCTYPE html>
<html>
<head>
    <title>Final Routing Test Results</title>
    <style>body{font-family:monospace;padding:20px;}.pass{color:green;}.fail{color:red;}</style>
</head>
<body>
    <h1>🎯 FINAL ROUTING ANALYSIS</h1>
    <div id="results">Testing...</div>

    <script>
        async function testRouting() {
            try {
                // Test root route with cache bypass
                const response = await fetch('/?_bypass=' + Date.now(), {
                    cache: 'no-cache'
                });
                const html = await response.text();
                
                const hasReactRoot = html.includes('<div id="root">');
                const hasReactBundle = html.includes('/assets/index.js');
                const hasTitle = html.includes('WIMP Kitchen Companion');
                
                const allPass = hasReactRoot && hasReactBundle && hasTitle;
                
                document.getElementById('results').innerHTML = `
                    <div class="${allPass ? 'pass' : 'fail'}">
                        <h2>ROOT ROUTE (/) TEST RESULTS:</h2>
                        <p>HTTP Status: ${response.status}</p>
                        <p>Has React Root: ${hasReactRoot ? '✅ YES' : '❌ NO'}</p>
                        <p>Has React Bundle: ${hasReactBundle ? '✅ YES' : '❌ NO'}</p>
                        <p>Has Title: ${hasTitle ? '✅ YES' : '❌ NO'}</p>
                        <h3>${allPass ? '🎉 ALL TESTS PASS!' : '⚠️ TESTS FAILED'}</h3>
                        <h3>The root route ${allPass ? 'IS' : 'IS NOT'} serving the built React app correctly.</h3>
                    </div>
                `;
            } catch (error) {
                document.getElementById('results').innerHTML = 
                    `<div class="fail">Error: ${error.message}</div>`;
            }
        }
        
        testRouting();
    </script>
</body>
</html>
