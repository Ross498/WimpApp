<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Authentication Cache - WIMP</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1E293B 0%, #334155 100%);
            color: white;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            max-width: 500px;
            backdrop-filter: blur(10px);
        }
        h1 {
            color: #F59E0B;
            margin-bottom: 24px;
        }
        button {
            background: #F59E0B;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 8px;
            transition: all 0.2s;
        }
        button:hover {
            background: #D97706;
            transform: translateY(-1px);
        }
        .status {
            margin: 16px 0;
            padding: 12px;
            border-radius: 8px;
            font-weight: 500;
        }
        .success {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22C55E;
        }
        .warning {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid #F59E0B;
        }
        #log {
            text-align: left;
            background: rgba(0, 0, 0, 0.3);
            padding: 16px;
            border-radius: 8px;
            margin-top: 16px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Clear Authentication Cache</h1>
        <p>This will remove all cached demo user data and force fresh authentication.</p>
        
        <button onclick="clearAllCache()">Clear All Cache</button>
        <button onclick="goToApp()">Go to App</button>
        
        <div id="status"></div>
        <div id="log"></div>
    </div>

    <script>
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${timestamp}] ${message}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function showStatus(message, type = 'success') {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
        }

        function clearAllCache() {
            log('🧹 Starting complete cache clearing...');
            
            try {
                // Clear localStorage
                const authKeys = ['authToken', 'user', 'isAuthenticated'];
                let clearedItems = 0;
                
                authKeys.forEach(key => {
                    if (localStorage.getItem(key)) {
                        const value = localStorage.getItem(key);
                        localStorage.removeItem(key);
                        log(`✅ Removed ${key}: ${value.substring(0, 50)}...`);
                        clearedItems++;
                    }
                });

                // Clear all user-related items
                for (let i = localStorage.length - 1; i >= 0; i--) {
                    const key = localStorage.key(i);
                    if (key && (key.includes('user') || key.includes('auth') || key.includes('demo') || key.includes('Demo'))) {
                        const value = localStorage.getItem(key);
                        localStorage.removeItem(key);
                        log(`🗑️ Removed cached item: ${key}`);
                        clearedItems++;
                    }
                }

                // Clear sessionStorage
                const sessionCount = sessionStorage.length;
                sessionStorage.clear();
                log(`🗑️ Cleared ${sessionCount} session storage items`);

                // Clear IndexedDB if present
                if ('indexedDB' in window) {
                    indexedDB.databases().then(databases => {
                        databases.forEach(db => {
                            if (db.name && db.name.includes('wimp')) {
                                indexedDB.deleteDatabase(db.name);
                                log(`🗑️ Cleared IndexedDB: ${db.name}`);
                            }
                        });
                    });
                }

                // Clear cache API
                if ('caches' in window) {
                    caches.keys().then(cacheNames => {
                        return Promise.all(
                            cacheNames.map(cacheName => {
                                log(`🗑️ Clearing cache: ${cacheName}`);
                                return caches.delete(cacheName);
                            })
                        );
                    });
                }

                log(`✅ Cache clearing completed! Cleared ${clearedItems + sessionCount} items total`);
                showStatus('✅ All authentication cache cleared successfully!', 'success');
                
                // Auto-reload after 2 seconds
                setTimeout(() => {
                    log('🔄 Reloading page in 3 seconds...');
                    showStatus('🔄 Reloading page to apply changes...', 'warning');
                    setTimeout(() => {
                        window.location.href = '/app';
                    }, 3000);
                }, 2000);

            } catch (error) {
                log(`❌ Error clearing cache: ${error.message}`);
                showStatus('❌ Error clearing cache. Please try manually.', 'warning');
            }
        }

        function goToApp() {
            window.location.href = '/app';
        }

        // Auto-clear on page load if requested
        if (window.location.search.includes('auto=true')) {
            setTimeout(() => {
                clearAllCache();
            }, 1000);
        }
    </script>
</body>
</html>
