<!DOCTYPE html>
<html>
<head>
    <title>Reset Authentication - WIMP</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            color: white;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            max-width: 400px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }
        h1 {
            color: #f59e0b;
            margin-bottom: 20px;
        }
        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
        }
        .button {
            background: #f59e0b;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            transition: background 0.2s;
        }
        .button:hover {
            background: #d97706;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Authentication Reset</h1>
        <p>Clearing all authentication data and cookies...</p>
        
        <div class="status" id="status">
            <div id="progress">Resetting authentication...</div>
        </div>
        
        <a href="/app" class="button" id="continueBtn" style="display: none;">
            Continue to Fresh Login
        </a>
    </div>

    <script>
        function updateStatus(message) {
            document.getElementById('progress').textContent = message;
        }

        function resetAuthentication() {
            // Clear all localStorage data
            updateStatus('✓ Clearing localStorage...');
            localStorage.clear();
            
            // Clear all sessionStorage data
            updateStatus('✓ Clearing sessionStorage...');
            sessionStorage.clear();
            
            // Clear all cookies by setting them to expire
            updateStatus('✓ Clearing cookies...');
            document.cookie.split(";").forEach(function(c) { 
                document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
            });
            
            // Additional specific cookie clearing
            const cookiesToClear = ['authToken', 'user', 'isAuthenticated', 'connect.sid', 'session'];
            cookiesToClear.forEach(cookie => {
                document.cookie = `${cookie}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
                document.cookie = `${cookie}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; domain=${window.location.hostname};`;
            });
            
            updateStatus('✓ Authentication completely reset!');
            
            // Show continue button
            document.getElementById('continueBtn').style.display = 'inline-block';
            
            console.log('🔄 All authentication data cleared');
        }

        // Start the reset process
        setTimeout(resetAuthentication, 500);
    </script>
</body>
</html>
